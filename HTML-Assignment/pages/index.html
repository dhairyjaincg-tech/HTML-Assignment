<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Birds Image</h2>

    <img src="download.jpg" alt="Beautiful birds">

    <h2>Logo Image</h2>
    <img src="../images/logo.png" alt="Logo" width="200px">

    <h2>Banner</h2>
    <img src="../Assets/images/banner.jpg" alt="Banner Image">
    
    <img src="../html_image/photo.jpg" alt="Photo">

    <img src="images/nature.jpg" alt="BeautifulNature View" width="300" Height="200">

    <img src="download.jpg" alt="Beautiful birds" title="Click to view full size">

    <h2>An image of hall</h2>

    <img src="image2.jpg" alt="Hall Image" 
    alt="image of hall" loading="lazy">
    
    <h2>Hero image</h2>
    <img src="hero.jpg" alt="Hero Image" loading="eager" width="200" height="300">
    
    
    <img src="images/buds.png" alt="Photo" loading="auto" width="200" height="200">  
    <hr>
    With loading="auto", the browser decides whether to load the image immediately or later.
    </hr>  

    <title>Responsive Image</title>  
    
    <img src="images/medium.jpg"
         srcset="images/small.jpg 400w,
                 images/medium.jpg 800w,
                 images/large.jpg 1200w"
         alt="Responsive Image">

    <img src="images/nature.jpg" alt="Beautiful Photo" width="600" height="400" loading="lazy" title="Click to view full size"
     srcset="images/nature.jpg 400w,
             images/nature.jpg 800w">

    <title>Two Images</title>
    <img src="../Assets/logo2.png"
         alt="Company Logo"
         width="250"
         loading="eager">

    <img src="images/Product/shoes.jpg"
         alt="Product Shoe"
         width="250"
         loading="lazy">


    
</body>
</html>
